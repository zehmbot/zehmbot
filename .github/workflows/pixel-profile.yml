name: pixel-profile

# Redraws the pixel-art GIFs with live GitHub stats and Rabat's current weather,
# then publishes them to the `output` branch that the README points at.

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, so the window keeps up with the sky
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pixel/**"
      - ".github/workflows/pixel-profile.yml"

permissions:
  contents: write

concurrency:
  group: pixel-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "pillow>=11"

      - name: Draw the room
        run: python pixel/generate.py --live --readme
        env:
          # Optional: add a PIXEL_TOKEN secret (classic PAT, read:user) to also
          # count private contributions. The built-in token sees public ones.
          GH_API_TOKEN: ${{ secrets.PIXEL_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      - name: Publish GIFs to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "render $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output

      - name: Commit README if the project list changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh projects [skip ci]" README.md
            git push
          fi
